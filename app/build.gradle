plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.zugulu.cinecam'
    compileSdk 35
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.zugulu.cinecam"
        minSdk 26
        targetSdk 34
        versionCode 25
        versionName "2.16"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
}
